version: "3.8"

services:
  gcs-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        GOPROXY: "${GOPROXY:-https://goproxy.cn|https://proxy.golang.org|direct}"
    container_name: gcs-distill-server
    environment:
      AI_MARKET_DB_PASSWORD: "${AI_MARKET_DB_PASSWORD:-}"
    ports:
      - "18080:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - /storage-md0/renyuan/gcs-distill-data/shared-workspace:/mnt/shared/distill
      - /storage-md0/renyuan/gcs-distill-data/logs:/var/log/gcs-distill
    networks:
      - gcs-network
    restart: unless-stopped

networks:
  gcs-network:
    driver: bridge
