ion><aside class="gd-panel gd-properties"><div class="gd-label">任务配置</div><div><span class="gd-label">教师</span><strong>DeepSeek-R1 · 服务示例</strong></div><div><span class="gd-label">执行方式</span><strong>调用已有推理服务</strong></div><div><span class="gd-label">训练安排</span><strong>${t.train?'数据完成后训练学生模型':'只生产数据'}</strong></div><div><span class="gd-label">数据来源</span><strong>独立数据集 · 当前用户</strong></div><button class="gd-btn link" data-action="detail-tab" data-value="artifacts">查看产物与配置</button></aside></div>`}`}
function pairGap(s){return s.score-[2,4,6,3][samples.indexOf(s)]}
function filteredSamples(type,threshold){return samples.filter(s=>(type==='dpo'?pairGap(s):s.score)>=threshold)}
function thresholdLabel(type,value){return type==='dpo'?value+' 分':value+' / 9'}
function sampleView(type){const rows=filteredSamples(type,state.threshold);return `<div class="gd-filter"><label for="gd-threshold">${type==='dpo'?'最小优选/差选评分差':'最低有用性评分'}</label><input id="gd-threshold" type="range" min="0" max="9" value="${state.threshold}"><strong id="gd-threshold-label">${thresholdLabel(type,state.threshold)}</strong><span class="gd-muted" id="gd-filter-count">示例保留 ${rows.length} / ${samples.length} 条</span></div><div class="gd-panel" id="gd-sample-list">${sampleRows(rows,type)}</div><div class="gd-hint">筛选只影响当前示例预览，不会修改已生成的数据集。示例分数不代表实际质量统计。</div>`}
function sampleRows(rows,type){return rows.map((s,i)=>`<article class="gd-sample"><div class="gd-row"><span class="gd-tag">样本 ${i+1}</span><span class="gd-status success">${type==='dpo'?'评分差 '+pairGap(s)+' 分':'有用性 '+s.score+' / 9'}</span></div><p class="gd-sample-question">${s.q}</p>${type==='dpo'?`<div class="gd-pair"><div><strong style="color:var(--gd-green)">✓ 优选回答 · 示例分 ${s.score}</strong><p>${s.chosen}</p></div><div><strong style="color:var(--gd-red)">差选回答 · 示例分 ${s.score-pairGap(s)}</strong><p>${s.rejected}</p></div></div>`:`<p class="gd-sample-answer">${s.a}</p>`}</article>`).join('')||'<div class="gd-empty">当前阈值下没有样本，请调整筛选条件。</div>'}

 return `<div class="gd-detail-top"><button class="gd-back" data-action="back">← 返回任务列表</button><div class="gd-row">${lifecycleButtons(t)}<button class="gd-btn" data-action="new">${['failed','canceled'].includes(t.status)?'以此配置新建':'复用配置'}</button></div></div><div class="gd-row"><div><h3 class="gd-detail-title">${esc(t.name)}</h3><div class="gd-subtitle">客服管理项目 / ${esc(t.recipeName||r.name)} / ${t.when}</div></div>${status(t)}</div>${t.status==='failed'?`<div class="gd-intro" role="alert"><strong>${esc(t.failureStage||'蒸馏数据')}失败</strong>　${esc(t.error||'请查看对应阶段日志。')}${hasData(t)?'<div>已生成的数据集仍可预览和复用。</div>':''}</div>`:''}${t.status==='canceled'?'<div class="gd-intro">任务已取消。已落盘的中间结果保留，可在日志与产物中检查。</div>':''}<div class="gd-tabs" style="margin-top:20px" role="tablist" aria-label="任务详情">${[['overview','运行概览'],['samples','样本与质量'],['artifacts','日志与产物']].map(([v,n])=>`<button role="tab" aria-selected="${state.detailTab===v}" class="gd-tab ${state.detailTab===v?'active':''}" data-action="detail-tab" data-value="${v}">${n}</button>`).join('')}</div>${body}`;
};
artifactView=function(t){return `<div class="gd-layout"><section class="gd-panel"><div class="gd-panel-header">本次任务产物<span class="gd-label">数据与模型分别展示</span></div><table class="gd-table"><thead><tr><th>产物</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>蒸馏数据集<div class="gd-secondary">${recipes[t.type].label}</div></td><td>${hasData(t)?t.count+' 条 · 已登记':'尚未导出'}</td><td>${hasData(t)?'<button class="gd-btn link" data-action="detail-tab" data-value="samples">预览</button><button class="gd-btn link" data-action="download">下载数据</button>':'—'}</td></tr><tr><td>评分与筛选中间数据</td><td>${hasData(t)?'已保留':'以实际阶段产物为准'}</td><td><button class="gd-btn link" data-action="log">查看阶段日志</button></td></tr>${t.train?`<tr><td>学生模型权重<div class="gd-secondary">${esc(studentName(t))} · LoRA 示例</div></td><td>${t.checkpoint?'已产出适配器权重':t.status==='failed'?'训练失败，未产出权重':'尚未产出'}</td><td><button class="gd-btn link" data-action="log">训练日志</button></td></tr>`:''}</tbody></table><div style="padding:16px">${hasData(t)?'<button class="gd-btn primary" data-action="train">使用此数据集训练</button>':''}<details class="gd-advanced"><summary>存储与版本信息</summary><div class="gd-code">引擎：EasyDistill 2.0.0<br>数据：用户数据集 / generated / 数据集版本<br>运行：用户工作区 / projects / 项目 / runs / 任务<br>学生基模：共享只读模型池${t.train?'<br>权重：本次运行 / models / checkpoints':''}<br>模型效果：独立测评，训练完成不代表效果达标</div></details></div></section><section class="gd-panel gd-properties"><div class="gd-row"><span>执行日志</span><span class="gd-tag">状态示例</span></div><pre class="gd-code">${hasData(t)?'[数据导出] 已登记 '+t.count+' 条数据':'[数据导出] 尚未完成'}${t.train?'\n[学生训练] '+(t.checkpoint?'检查到适配器权重':t.status==='failed'?'镜像启动失败':'尚无权重产物'):''}</pre><button class="gd-btn small" data-action="log">完整日志</button></section></div>`};
const reviewedQuality=step3;
step3=function(w){let html=reviewedQuality(w);if(w.type==='dpo'){html=html.replace(`${w.threshold} / 9`,thresholdLabel('dpo',w.threshold)).replace('要求回答正确','要求优选回答正确').replace(`保留 ${samples.filter(s=>s.score>=w.threshold).length} / 4 条`,`保留 ${filteredSamples('dpo',w.threshold).length} / 4 条`)}if(w.type==='sft'&&w.job&&w.job!=='advanced_instruct_distill'){const end=html.indexOf('<div class="gd-form-label">数据产物</div>');if(end>=0)html='<div class="gd-intro">此配方采用生成、增强或均衡流程。需要自动评分和过滤时，选择高质量指令蒸馏。</div>'+html.slice(end)}return html.replace('高级配置 · 查看接口映射','请求结构示例 · 字段对照见交接说明')};
const reviewedConfirm=step4;
step4=function(w){return reviewedConfirm(w).replace('要求正确，最低评分 '+w.threshold,w.type==='dpo'?'优选/差选最小评分差 '+w.threshold+' 分':'按所选配方规则执行')};
root.addEventListener('click',ev=>{const a=ev.target.closest('[data-action]')?.dataset.action,t=state.tasks.find(t=>t.id===state.detail);if(!t)return;if(a==='run-start'&&t.status==='pending'){t.status='running';render();toast('仅演示启动状态，未提交实际任务')}if(a==='run-cancel'&&['scheduled','preparing','running'].includes(t.status)){t.completedStages=hasData(t)?4:t.status==='running'?2:0;t.status='canceled';render();toast('仅演示取消状态，未向服务器发送请求')}});
root.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-action]'),w=state.wizard;if(!b||!w)return;
 const a=b.dataset.action;
 if(a==='train-mode'){w.train=b.dataset.value==='train';w.resourceError='';wizard();remember()}
 if(w.train&&!w.studentId&&(a==='submit'||a==='next'&&w.step===1)){ev.stopImmediatePropagation();toast('请先选择学生基模');return}
 const confirming=a==='submit'||a==='next'&&w.step===4||a==='step'&&b.dataset.value==='5';
 if(w.train&&confirming&&(!selectedNode(w)||!w.gpuIndices.length)){
  ev.stopImmediatePropagation();w.step=4;w.resourceError='请选择训练节点，并至少勾选 1 张 GPU。';wizard();remember();return;
 }
},true);
root.addEventListener('change',ev=>{
 const el=ev.target,w=state.wizard;if(!w)return;
 if(el.id==='gd-data-node')w.dataNode=el.value;
 else if(el.id==='gd-training-node'){w.trainingNode=el.value;w.gpuIndices=[];w.resourceError=''}
 else if(el.matches('[data-gpu-index]')){
  const i=Number(el.dataset.gpuIndex),n=selectedNode(w);if(!n||n.busy.includes(i))return;
  w.gpuIndices=el.checked?[...new Set([...w.gpuIndices,i])].sort((a,b)=>a-b):w.gpuIndices.filter(x=>x!==i);w.resourceError='';
 }else if(el.id==='gd-finetuning')w.finetuningType=el.value;
 else if(el.id==='gd-epochs')w.epochs=Number(el.value);
 else if(el.id==='gd-learning-rate')w.learningRate=Number(el.value);
 else if(el.id==='gd-batch-size')w.batchSize=Number(el.value);
 else return;
 wizard();remember();
});
root.addEventListener('change',ev=>{if(ev.target.id==='gd-student-model'&&state.wizard){state.wizard.studentId=ev.target.value;wizard();remember()}});
const recipeJobs={'高质量指令蒸馏':'advanced_instruct_distill','基础指令蒸馏':'instruct_distill','指令增强蒸馏':'augmented_instruct_distill','类别均衡蒸馏':'balanced_instruct_distill','思维链评分与难度混合':'advanced_cot_distill','基础思维链蒸馏':'cot_distill','思维链压缩':'cot_long2short','思维链扩展':'cot_short2long'};
root.addEventListener('change',ev=>{if(ev.target.id==='gd-recipe'&&state.wizard){state.wizard.job=recipeJobs[ev.target.value]||recipes[state.wizard.type].job;state.wizard.recipeName=ev.target.value;remember()}});
root.addEventListener('click',()=>{const el=overlay.querySelector('#gd-recipe');if(el&&state.wizard?.recipeName)el.value=state.wizard.recipeName});
state.tasks.push({id:'demo-trained',name:'客服学生训练 · 完成示例',type:'sft',status:'success',count:3,when:'今天 10:20',train:true,studentId:'demo-student-qwen-1.5b',checkpoint:true},{id:'demo-failed',name:'学生训练 · 失败示例',type:'sft',status:'failed',count:3,when:'今天 10:25',train:true,studentId:'demo-student-qwen-1.5b',failureStage:'学生训练',error:'训练镜像启动失败（示例），请检查镜像和阶段日志。'},{id:'demo-running',name:'教师生成 · 运行示例',type:'sft',status:'running',count:0,when:'刚刚',train:false});
const reviewedTasks=tasks;
tasks=function(){return reviewedTasks().replace('<option value="pending">待提交</option>','<option value="pending">待启动</option><option value="scheduled">排队中</option><option value="preparing">准备中</option><option value="running">运行中</option><option value="failed">失败</option><option value="canceled">已取消</option>')};
state.wizard={...resourceDefaults(),step:4,type:'sft',name:'客服问答 · 资源选择示例',train:saved?.executionMode!=='data_only',studentId:studentModels[0].id,teacher:'service',dataset:'客服种子集 · 示例',endpoint:'',model:'DeepSeek-R1',threshold:7,trainingNode:resourceNodes.some(n=>n.name===saved?.selectedNode)?saved.selectedNode:resourceNodes[0].name};
state.wizard.gpuIndices=(saved?.selectedGPUIndices||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<8&&!selectedNode(state.wizard).busy.includes(i));
overlay.hidden=false;
render();
if(globalThis.Tweak){const design={compact:false,radius:6};const t=new Tweak({container:root,onChange:()=>{root.classList.toggle('gd-compact',design.compact);root.style.setProperty('--gd-radius',design.radius+'px')}});t.addToggle(design,'compact',{label:'紧凑表格'});t.addSlider(design,'radius',{label:'卡片圆角',min:0,max:12,step:2,unit:'px'});}
window.addEventListener('openai:set_globals',ev=>{const m=ev.detail?.globals?.widgetState?.modelContent;if(m?.view&&['tasks','projects','datasets'].includes(m.view)){state.view=m.view;render()}});
})();
</script>
