<style>

#distill-studio .ds-alert{display:flex;align-items:flex-start;gap:9px;padding:12px 15px;border-radius:7px;background:color-mix(in srgb,var(--ds-red) 7%,var(--ds-surface));color:var(--ds-red);font-size:12px;margin-bottom:17px}
#distill-studio .ds-preview-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}
#distill-studio .ds-sample-question{font-size:15px;font-weight:500;padding:18px 0;margin-top:10px!important}
#distill-studio .ds-sample-answer{white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}
#distill-studio .ds-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

#distill-studio .ds-range{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
#distill-studio .ds-range input{width:190px;max-width:100%}
#distill-studio .ds-data-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 128px;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--ds-line)}
#distill-studio .ds-data-row:last-child{border:0}
#distill-studio .ds-project{padding:22px}
#distill-studio .ds-project h3{margin-bottom:8px}
#distill-studio .ds-project-footer{margin-top:24px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap}
#distill-studio .ds-import-panel{padding:20px;margin-bottom:16px}
#distill-studio #ds-toast{position:absolute;top:118px;left:50%;transform:translateX(-50%);max-width:calc(100% - 30px);z-index:20;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:7px;box-shadow:0 5px 25px light-dark(#14264d16,#0005);padding:12px 18px;font-size:12px}
#distill-studio[data-density="compact"] .ds-task-row,#distill-studio[data-density="compact"] .ds-data-row{padding-top:13px;padding-bottom:13px}
@media(max-width:900px){#distill-studio .ds-shell{grid-template-columns:144px minmax(0,1fr)}#distill-studio .ds-sidebar{padding:17px 6px}#distill-studio .ds-nav-item{gap:8px;padding-left:10px;font-size:11px}#distill-studio .ds-subnav{padding-left:35px}#distill-studio #ds-workspace{padding:22px 20px}#distill-studio .ds-context,#distill-studio .ds-module-nav{padding-left:20px;padding-right:20px}#distill-studio .ds-form-body{padding:26px 24px}#distill-studio .ds-task-row{gap:12px;grid-template-columns:minmax(0,1fr) 85px 65px 26px;padding:17px}#distill-studio .ds-gpu-grid{grid-template-columns:repeat(4,minmax(0,1fr))}#distill-studio .ds-mode{padding:15px 12px;gap:10px}}
@media(max-width:650px){#distill-studio .ds-shell{grid-template-columns:1fr;min-height:700px}#distill-studio .ds-sidebar{display:none}#distill-studio .ds-topbar{padding:0 16px}#distill-studio .ds-top-links{display:none}#distill-studio .ds-context{padding:0 16px}#distill-studio .ds-module-nav{padding:0 16px;gap:26px}#distill-studio #ds-workspace{padding:20px 16px}#distill-studio .ds-page-head{margin-bottom:17px}#distill-studio h1{font-size:21px}#distill-studio .ds-form-body{padding:24px 19px}#distill-studio .ds-stepbar{padding:17px;gap:10px}#distill-studio .ds-step{font-size:11px;gap:6px}#distill-studio .ds-step-number{width:23px;height:23px}#distill-studio .ds-mode-grid{gap:10px}#distill-studio .ds-mode{flex-direction:column;align-items:flex-start;gap:9px;padding:14px 12px}#distill-studio .ds-mode small{font-size:11px}#distill-studio .ds-grid,#distill-studio .ds-output-grid,#distill-studio .ds-pair{grid-template-columns:1fr}#distill-studio .ds-footer{padding:16px 19px}#distill-studio .ds-footer-path{width:100%}#distill-studio .ds-footer>.ds-row{margin-left:auto}#distill-studio .ds-kind-tabs{gap:5px}#distill-studio .ds-pill{padding:6px 10px;font-size:11px}#distill-studio .ds-task-row{grid-template-columns:minmax(0,1fr) 73px 25px;gap:8px;padding:17px 14px}#distill-studio .ds-task-row>.ds-task-output{display:none}#distill-studio .ds-task-meta{gap:6px}#distill-studio .ds-task-name{font-size:13px}#distill-studio .ds-data-row{grid-template-columns:minmax(0,1fr) 60px;gap:10px;padding:17px 14px}#distill-studio .ds-data-actions{grid-column:1/-1;display:flex;gap:16px}#distill-studio .ds-detail-panel{padding:18px}#distill-studio .ds-stages{gap:6px}#distill-studio .ds-definition{grid-template-columns:64px minmax(0,1fr);gap:8px 12px}#distill-studio .ds-button{padding:8px 11px}#distill-studio .ds-help{overflow-wrap:anywhere}#distill-studio .ds-input{font-size:16px}#distill-studio .ds-detail-tabs{gap:18px}#distill-studio .ds-teacher-tabs{gap:12px}#distill-studio .ds-teacher-tabs label{font-size:11px}}
@media(pointer:coarse){#distill-studio .ds-button,#distill-studio .ds-pill,#distill-studio .ds-filter,#distill-studio .ds-step{min-height:44px}#distill-studio .ds-input{font-size:16px;min-height:44px}#distill-studio .ds-fold summary{min-height:44px}}
</style>
<script>
(()=>{
  const root=document.getElementById('distill-studio');
  const workspace=root.querySelector('#ds-workspace');
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button=(text,action,style='',attrs='')=>`<button type="button" class="ds-button cursor-interaction ${style}" data-action="${action}" ${attrs}>${text}</button>`;
  const kinds={
    sft:{name:'指令 SFT',output:'SFT 数据集',recipes:[['advanced_instruct_distill','高质量指令'],['instruct_distill','基础指令'],['augmented_instruct_distill','指令增强'],['balanced_instruct_distill','类别均衡']]},
    cot:{name:'推理 CoT',output:'推理数据集',recipes:[['advanced_cot_distill','评分与难度混合'],['cot_distill','基础思维链'],['cot_long2short','思维链压缩'],['cot_short2long','思维链扩展']]},
    dpo:{name:'偏好 DPO',output:'DPO 偏好数据',recipes:[['dpo_data_build','偏好对构建']]},
    agent:{name:'Agent',output:'工具轨迹数据',recipes:[['agent_distill','工具轨迹蒸馏']]},
    mm:{name:'图文',output:'多模态数据集',recipes:[['mm_instruct_distill','图文指令蒸馏']]}
  };
  const nodes=[{id:'specialai-3090-0',label:'specialai-3090-0',model:'RTX 3090',memory:24,busy:[0,1,2,3,4,5]},{id:'gpu-a800-demo',label:'gpu-a800-demo',model:'A800',memory:80,busy:[0,1,2,3]}];
  const models=[{id:'demo-qwen-1.5b',name:'DeepSeek-R1-Distill-Qwen-1.5B',template:'qwen',vision:false},{id:'demo-qwen-7b',name:'Qwen2.5-7B-Instruct',template:'qwen',vision:false},{id:'demo-qwen-vl-3b',name:'Qwen2.5-VL-3B-Instruct',template:'qwen2_vl',vision:true}];
  const teachers=[{id:'demo-r1',name:'DeepSeek-R1',vision:false},{id:'demo-vl',name:'Qwen2.5-VL',vision:true}];
  const samples=[
    {q:'忘记密码时，用户应该如何处理？',a:'在登录页选择“忘记密码”，通过绑定邮箱验证身份后重置密码。',score:9,chosen:'引导用户通过绑定邮箱验证身份，在安全页面重置密码。',rejected:'把现有密码直接发送给用户。',margin:7},
    {q:'退款申请提交后如何查看进度？',a:'进入订单详情，打开退款记录，查看审核状态与预计处理时间。',score:8,chosen:'在订单详情中查看退款记录；超过预计时间可联系人工客服。',rejected:'不知道，等通知。',margin:4},
    {q:'是否支持开具企业发票？',a:'支持。在已完成订单中填写企业抬头和税号，提交开票申请。',score:7,chosen:'支持，请在已完成订单中提交企业抬头和税号后申请开票。',rejected:'联系客服。',margin:1},
    {q:'账号被锁定后怎么办？',a:'关闭页面再试。',score:3,chosen:'查看锁定原因，通过身份验证解锁或联系人工客服核验。',rejected:'重新注册账号。',margin:0}
  ];
  const projects=[{id:'demo-project',name:'客服管理',teacher:'demo-r1',description:'客服领域数据与学生模型'},{id:'demo-research',name:'知识问答',teacher:'demo-r1',description:'业务知识与推理数据'}];
  const seeds=[
    {id:'demo-seed',name:'客服问答种子',source:'upload',format:'JSONL',count:4,kind:'sft',records:samples.map(s=>({instruction:s.q}))},
    {id:'demo-cot',name:'订单推理种子',source:'candidate',format:'JSONL',count:2,kind:'cot',records:[{problem:'订单总额 200 元，使用 20 元优惠券后退款一半，应退多少？'},{problem:'说明拆单退款时优惠券应如何分摊。'}]},
    {id:'demo-agent',name:'客服角色种子',source:'candidate',format:'JSONL',count:1,kind:'agent',records:[{background:'需要使用订单查询与退款工具处理售后问题的客服人员'}]},
    {id:'demo-images',name:'凭证图文种子',source:'upload',format:'JSONL',count:1,kind:'mm',records:[{instruction:'提取凭证中的订单信息。',images:['receipt-demo.png']}]}
  ];
  const statusLabels={pending:'待启动',scheduled:'排队中',preparing:'准备中',running:'运行中',succeeded:'已完成',failed:'失败',canceled:'已取消'};
  const stageNames=['教师配置','数据准备','蒸馏数据','数据导出','学生训练'];
  function freshDraft(projectId=''){
    const project=projects.find(p=>p.id===projectId);
    return {name:(project?.name||'新任务')+' · 蒸馏任务',project:project?.id||'',kind:'sft',recipe:'advanced_instruct_distill',train:false,student:'',dataset:'demo-seed',teacherSource:'service',teacher:project?.teacher||'',endpoint:'',apiModel:'',secretRef:'',node:'',gpus:[],dataNode:'',method:'lora',template:'qwen',epochs:3,lr:0.00002,batch:1,threshold:7,margin:1,candidates:2,maxSteps:10,trajectories:2,difficulty:'0–3，3–6，6–10',lengthPolicy:'difficulty',maxTokens:2048,concurrency:4,mapping:'instruction'};
  }
  const base=freshDraft('demo-project');
  const tasks=[
    {id:'demo-running',name:'客服问答 · 质量增强',kind:'sft',status:'running',count:0,completed:2,project:'demo-project',time:'10:35',train:false,draft:{...base}},
    {id:'demo-trained',name:'客服助手 · 学生训练',kind:'sft',status:'succeeded',count:3,completed:5,project:'demo-project',time:'10:20',train:true,weights:true,draft:{...base,train:true,student:'demo-qwen-1.5b',node:nodes[0].id,gpus:[6,7]}},
    {id:'demo-dpo',name:'客服偏好对 · 首次生成',kind:'dpo',status:'succeeded',count:3,completed:4,project:'demo-project',time:'10:05',train:false,draft:{...base,kind:'dpo',recipe:'dpo_data_build'}},
    {id:'demo-failed',name:'客服学生 · 训练失败',kind:'sft',status:'failed',count:3,completed:4,project:'demo-project',time:'09:40',train:true,draft:{...base,train:true,student:'demo-qwen-1.5b',node:nodes[0].id,gpus:[7]}}
  ];
  const state={screen:'list',nav:'projects',projectId:null,pendingDataset:'',projectSettings:false,step:1,draft:freshDraft(),detail:'demo-trained',detailTab:'overview',taskFilter:'all',datasetFilter:'all',open:new Set(),errors:{},seedPreview:false,sampleIndex:0,previewThreshold:0,selectedStage:0,importPanel:'',importError:'',projectNew:false,teacherTest:false};
  let toastTimer;
  function toast(message){const box=root.querySelector('#ds-toast');box.textContent=message;box.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.hidden=true,3500);}
  function remember(){
    const d=state.draft;
    window.openai?.setWidgetState?.({modelContent:{design:'distill-project-first',view:state.nav,screen:state.screen,projectId:state.projectId,pendingDataset:state.pendingDataset,recipe:d.recipe,trainStudent:d.train,studentModel:d.student,trainingNode:d.node,gpuIndices:d.train?[...d.gpus]:[],step:state.step},privateContent:{draft:{...d,secretRef:''},detail:state.detail,detailTab:state.detailTab}})?.catch(()=>{});
  }
  function restore(snapshot){
    if(snapshot?.modelContent?.design!=='distill-project-first')return;
    const m=snapshot.modelContent,p=snapshot.privateContent;
    state.nav=m.view==='datasets'?'datasets':'projects';
    state.projectId=projects.some(project=>project.id===m.projectId)?m.projectId:null;
    state.pendingDataset=seeds.some(seed=>seed.id===m.pendingDataset)?m.pendingDataset:'';
    state.screen=['create','project','detail','list'].includes(m.screen)?m.screen:'list';
    if(p?.draft&&kinds[p.draft.kind]){
      state.draft={...freshDraft(state.projectId),...p.draft,secretRef:''};
      state.draft.gpus=(state.draft.gpus||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<8&&!nodes.find(n=>n.id===state.draft.node)?.busy.includes(i));
    }
    state.step=[1,2,3].includes(m.step)?m.step:1;
    if(tasks.some(t=>t.id===p?.detail))state.detail=p.detail;
    if(['overview','samples','logs'].includes(p?.detailTab))state.detailTab=p.detailTab;
    if(state.nav==='datasets'){state.screen='list';state.projectId=null;}
    if(!state.projectId&&state.screen!=='list')state.screen='list';
    if(state.screen==='create'&&state.draft.project!==state.projectId)state.screen='project';
    if(state.screen==='detail'&&currentTask().project!==state.projectId)state.screen='project';
  }
  restore(window.openai?.widgetState);
  function selectedNode(d=state.draft){return nodes.find(n=>n.id===d.node);}
  function modelName(d){return models.find(m=>m.id===d.student)?.name||'尚未选择';}
  function recipeName(d){return kinds[d.kind].recipes.find(r=>r[0]===d.recipe)?.[1]||kinds[d.kind].recipes[0][1];}
  function teacherName(d){return d.teacherSource==='service'?teachers.find(t=>t.id===d.teacher)?.name||'尚未选择':d.apiModel||'兼容 API';}
  function gpuLabel(d){return d.node&&d.gpus.length?`${d.node} · GPU ${d.gpus.join('、')}`:'尚未选择';}
  function status(t){return `<span class="ds-status" data-status="${t.status}"><span class="ds-dot"></span>${statusLabels[t.status]}</span>`;}
  function fold(id,title,content){return `<details class="ds-fold" data-fold="${id}" ${state.open.has(id)?'open':''}><summary class="cursor-interaction">${title}</summary><div class="ds-fold-content">${content}</div></details>`;}
  function options(items,value){return items.map(([v,label,disabled])=>`<option value="${esc(v)}" ${v===value?'selected':''} ${disabled?'disabled':''}>${esc(label)}</option>`).join('');}
  function error(key){return state.errors[key]?`<div class="ds-error" role="alert">${esc(state.errors[key])}</div>`:'';}
  function input(key,value,extra=''){return `<input class="ds-input" id="ds-${key}" data-field="${key}" value="${esc(value)}" ${state.errors[key]?'aria-invalid="true"':''} ${extra}>`;}
  function select(key,items,value,extra=''){return `<select class="ds-input" id="ds-${key}" data-field="${key}" ${state.errors[key]?'aria-invalid="true"':''} ${extra}>${options(items,value)}</select>`;}
  function label(key,title,control,help=''){return `<label class="ds-field" for="ds-${key}"><span class="ds-label">${title}</span>${control}${help?`<span class="ds-help">${help}</span>`:''}${error(key)}</label>`;}
  function workflow(d){return `<span>种子数据</span>${icon('arrow-right')}<span>${kinds[d.kind].output}</span>${d.train?`${icon('arrow-right')}<span>学生模型</span>`:''}`;}
  function pageHead(title,action='',caption=''){return `<div class="ds-page-head"><div><h1>${title}</h1>${caption?`<div class="ds-caption">${caption}</div>`:''}</div>${action}</div>`;}
  function render(){
    if(['project','create','detail'].includes(state.screen)&&!activeProject()){
      state.screen='list';state.nav='projects';state.projectId=null;
    }
    root.querySelectorAll('[data-nav]').forEach(el=>el.setAttribute('aria-current',el.dataset.nav===state.nav?'page':'false'));
    workspace.innerHTML=breadcrumb()+(state.screen==='create'?creator():state.screen==='detail'?detail():state.screen==='project'?taskPage():state.nav==='datasets'?datasetPage():projectPage());
    globalThis.lucide?.createIcons({attrs:{width:17,height:17}});
  }
  function creator(){const d=state.draft;return `${pageHead('新建蒸馏任务',button('返回项目','back-list','ds-quiet'))}<section class="ds-panel ds-wizard" aria-label="创建蒸馏任务"><nav class="ds-stepbar" aria-label="创建步骤">${['目标与学生','数据与教师','资源与确认'].map((name,i)=>`<button type="button" class="ds-step cursor-interaction ${i+1<state.step?'ds-done':''}" data-action="step" data-value="${i+1}" ${state.step===i+1?'aria-current="step"':''}><span class="ds-step-number">${i+1<state.step?'✓':i+1}</span><span>${name}</span></button>`).join('')}</nav><div class="ds-form-body">${state.step===1?goalStep(d):state.step===2?dataStep(d):resourceStep(d)}</div><footer class="ds-footer"><div class="ds-footer-path" aria-label="产出流程">${workflow(d)}</div><div class="ds-row">${state.step>1?button('上一步','previous'):''}${button(state.step===3?'创建任务':`下一步 ${icon('arrow-right')}`,state.step===3?'submit':'next','ds-primary')}</div></footer></section>`;}
  function goalStep(d){return `<div class="ds-section-head"><h2>希望得到什么？</h2><span class="ds-section-index">01 / 03</span></div><div class="ds-mode-grid" aria-label="任务目标">${[[false,'database','只生成数据','获得可复用的训练数据'],[true,'graduation-cap','数据 + 学生模型','生成数据后继续训练']].map(([v,ico,title,desc])=>`<button type="button" class="ds-mode cursor-interaction" data-action="mode" data-value="${v}" aria-pressed="${d.train===v}">${icon(ico)}${d.train===v?`<span class="ds-mode-check">${icon("circle-check")}</span>`:""}<span><strong>${title}</strong><small>${desc}</small></span></button>`).join('')}</div>${label('name','任务名称',input('name',d.name,'maxlength="100"'))}<div class="ds-block"><span class="ds-label">数据目标</span><div class="ds-kind-tabs" aria-label="数据目标">${Object.entries(kinds).map(([k,v])=>`<button type="button" class="ds-pill cursor-interaction" data-action="kind" data-value="${k}" aria-pressed="${d.kind===k}">${v.name}</button>`).join('')}</div>${label('recipe','配方',select('recipe',kinds[d.kind].recipes,d.recipe))}</div>${label('student','学生基模',select('student',[['',d.train?'请选择本地基模':'无需选择，仅生成数据'],...models.map(m=>[m.id,m.name,d.kind==='mm'&&!m.vision])],d.student,d.train?'':'disabled'),d.train?'本地共享模型池':'' )}${d.train&&d.kind==='mm'?'<div class="ds-help">图文任务仅显示可训练的视觉基模。</div>':''}`;}
  function dataStep(d){const seed=seeds.find(s=>s.id===d.dataset);return `<div class="ds-section-head"><h2>选择数据和教师</h2><span class="ds-section-index">02 / 03</span></div>${label('dataset','种子数据集',select('dataset',[['','请选择数据集'],...seeds.map(s=>[s.id,s.name])],d.dataset))}${seed?`<div class="ds-seed-info">${icon('file-json')}<span>${seed.format} · ${seed.count} 条</span><span>我的数据集</span>${button(state.seedPreview?'收起':'预览','seed-preview','ds-link')}</div>${state.seedPreview?`<div class="ds-preview"><span class="ds-tag">首条记录</span><pre>${esc(JSON.stringify(seed.records[0],null,2))}</pre></div>`:''}`:''}<div class="ds-block"><span class="ds-label">教师来源</span><div class="ds-teacher-tabs">${[['service','已有推理服务'],['api','兼容 API']].map(([value,title])=>`<label class="cursor-interaction"><input type="radio" name="ds-teacher-source" data-field="teacherSource" value="${value}" ${d.teacherSource===value?'checked':''}>${title}</label>`).join('')}</div>${d.teacherSource==='service'?`${label('teacher','教师服务',select('teacher',[['','请选择教师服务'],...teachers.map(t=>[t.id,t.name,d.kind==='mm'&&!t.vision])],d.teacher))}${d.teacher?`<div class="ds-teacher-state"><span class="ds-dot"></span>在线服务${d.kind==='mm'?' · 支持图像输入':''}</div>`:""}`:`${label('endpoint','服务基础地址',input('endpoint',d.endpoint,'type="url" placeholder="https://模型服务地址/v1"'))}<div class="ds-grid ds-block">${label('apiModel','模型名称',input('apiModel',d.apiModel))}${label('secretRef','密钥引用（可选）',input('secretRef',d.secretRef,'type="password" autocomplete="off"'))}</div><div class="ds-row ds-block">${button('测试连接','test-teacher')}${state.teacherTest?'<span class="ds-help">仅演示测试入口，未发起连接</span>':''}</div>`}</div>${fold('quality','质量与生成设置',qualityEditor(d))}${fold('mapping','字段映射',mappingEditor(d))}${error('parameters')}`;}
  function qualityEditor(d){const generation=`<div class="ds-grid ds-block">${label('maxTokens','最大输出长度',input('maxTokens',d.maxTokens,'type="number" min="1"'))}${label('concurrency','生成并发',input('concurrency',d.concurrency,'type="number" min="1"'))}</div>`;let specific='';if(d.kind==='dpo')specific=`<div class="ds-grid">${label('candidates','每条候选数',input('candidates',d.candidates,'type="number" min="2"'))}${label('margin','最小优选 / 差选评分差',input('margin',d.margin,'type="number" min="0" max="9"'))}</div>`;else if(d.kind==='cot')specific=`${label('difficulty','难度分组',input('difficulty',d.difficulty))}${label('lengthPolicy','推理长度',select('lengthPolicy',[['difficulty','匹配问题难度'],['fixed','固定目标长度']],d.lengthPolicy))}`;else if(d.kind==='agent')specific=`<div class="ds-grid">${label('maxSteps','轨迹最大步骤',input('maxSteps',d.maxSteps,'type="number" min="1"'))}${label('trajectories','每条种子轨迹数',input('trajectories',d.trajectories,'type="number" min="1"'))}</div><div class="ds-help">工具执行：模拟工具调用</div>`;else if(d.kind==='mm')specific='<div class="ds-help">保留图片引用与消息结构；教师须支持图像输入。</div>';else if(d.recipe==='advanced_instruct_distill')specific=`<label class="ds-label" for="ds-threshold">最低有用性评分 <span id="ds-threshold-value">${d.threshold} / 9</span></label><input id="ds-threshold" data-field="threshold" type="range" min="0" max="9" value="${d.threshold}" style="width:100%"><div class="ds-help">同时要求回答正确</div>`;else specific='<div class="ds-help">按所选配方执行生成与增强。</div>';return specific+generation;}
  function mappingEditor(d){const fields=d.kind==='agent'?['background']:d.kind==='cot'?['problem']:d.kind==='mm'?['instruction','images']:['instruction'];return fields.map((f,i)=>label('mapping'+i,f,`<input class="ds-input" id="ds-mapping${i}" data-map="${f}" value="${esc(d.fieldMapping?.[f]||f)}">`)).join('')+'<div class="ds-help">保留消息、附件和原始 metadata</div>';}
  function resourceStep(d){const node=selectedNode(d);return `<div class="ds-section-head"><h2>${d.train?'选择训练资源':'确认本次任务'}</h2><span class="ds-section-index">03 / 03</span></div>${d.train?`${label('node','训练节点',select('node',[['','选择一台服务器'],...nodes.map(n=>[n.id,`${n.label} · ${8-n.busy.length} 张可用`])],d.node))}${node?`<div class="ds-row ds-spread ds-block"><span class="ds-small">${node.model} <span class="ds-muted">· 每卡 ${node.memory} GB</span></span><div class="ds-legend"><span><i class="ds-free"></i>可选</span><span><i></i>占用</span></div></div><div class="ds-gpu-grid" aria-label="GPU 卡号">${Array.from({length:8},(_,i)=>`<label class="ds-gpu cursor-interaction ${node.busy.includes(i)?'ds-busy':''} ${d.gpus.includes(i)?'ds-selected':''}"><input type="checkbox" data-gpu="${i}" aria-label="GPU ${i}${node.busy.includes(i)?'，已占用':''}" ${node.busy.includes(i)?'disabled':''} ${d.gpus.includes(i)?'checked':''}><span>GPU ${i}</span></label>`).join('')}</div><div class="ds-gpu-summary" aria-live="polite"><strong>已选 ${d.gpus.length} 张${d.gpus.length?' · '+d.gpus.join('、'):''}</strong><span class="ds-muted">${d.gpus.length>1?'单机 DDP':d.gpus.length===1?'单卡训练':'请选择卡号'}</span></div>${error('gpus')}<div class="ds-help">进入学生训练阶段时申请所选卡；多卡显存不合并。</div>`:'<div class="ds-empty-resource">'+icon('server')+'先选择训练节点，再选择卡号</div>'}${fold('training','训练参数 · '+(d.method==='lora'?'LoRA':'全量微调'),trainingEditor(d))}`:''}<div class="ds-review"><div class="ds-review-title">${esc(d.name)}</div><dl class="ds-definition"><dt>配方</dt><dd>${kinds[d.kind].name} · ${esc(recipeName(d))}</dd><dt>种子数据</dt><dd>${esc(seeds.find(s=>s.id===d.dataset)?.name||'尚未选择')}</dd><dt>教师</dt><dd>${esc(teacherName(d))}</dd><dt>产出</dt><dd>${kinds[d.kind].output}${d.train?' + 学生模型':''}</dd>${d.train?`<dt>学生基模</dt><dd>${esc(modelName(d))}</dd>`:''}</dl></div>${fold('runtime','数据节点与运行环境',runtimeEditor(d))}${error('parameters')}<div class="ds-help ds-block">创建后为待启动状态，可在任务详情中启动。</div>`;}
  function trainingEditor(d){return `<div class="ds-grid">${label('method','训练方式',select('method',[['lora','LoRA'],['full','全量微调']],d.method))}${label('template','对话模板',input('template',d.template))}${label('epochs','训练轮数',input('epochs',d.epochs,'type="number" min="0.01" step="0.1"'))}${label('lr','学习率',input('lr',d.lr,'type="number" min="0.000000001" step="0.000001"'))}${label('batch','每卡批量',input('batch',d.batch,'type="number" min="1"'))}</div>`;}
  function runtimeEditor(d){return `${label('dataNode','数据执行节点',select('dataNode',[['','平台默认数据节点'],...nodes.map(n=>[n.id,n.label])],d.dataNode))}<dl class="ds-definition ds-block"><dt>数据引擎</dt><dd>EasyDistill 2.0 · CPU</dd>${d.train?'<dt>训练镜像</dt><dd>LLaMA-Factory 0.9.3 · CUDA 12.4</dd>':''}<dt>数据归属</dt><dd>我的数据集 · 可跨项目复用</dd><dt>模型来源</dt><dd>本地共享模型池</dd></dl>`;}
  function validate(through){const d=state.draft,e={};if(!activeProject()||d.project!==state.projectId){state.errors={project:'请先进入所属项目，再创建任务'};state.projectId=null;state.nav='projects';state.screen='list';return false;}if(!d.name.trim())e.name='请填写任务名称';if(d.train&&!d.student)e.student='请选择学生基模';if(d.train&&d.kind==='mm'&&!models.find(m=>m.id===d.student)?.vision)e.student='请选择支持视觉的学生基模';if(through>=2){if(!d.dataset)e.dataset='请选择种子数据集';if(d.teacherSource==='service'&&!d.teacher)e.teacher='请选择教师服务';if(d.teacherSource==='api'){try{const u=new URL(d.endpoint);if(!['http:','https:'].includes(u.protocol))throw Error();}catch{e.endpoint='请填写完整的 HTTP 或 HTTPS 基础地址';}if(!d.apiModel.trim())e.apiModel='请填写模型名称';}if(!(Number.isInteger(d.maxTokens)&&d.maxTokens>0&&Number.isInteger(d.concurrency)&&d.concurrency>0))e.parameters='生成长度和并发必须为正整数';if(d.kind==='dpo'&&!(Number.isInteger(d.candidates)&&d.candidates>=2&&d.margin>=0&&d.margin<=9))e.parameters='候选数至少为 2，评分差需在 0 到 9 之间';if(d.kind==='agent'&&!(Number.isInteger(d.maxSteps)&&d.maxSteps>0&&Number.isInteger(d.trajectories)&&d.trajectories>0))e.parameters='轨迹步骤数和轨迹数量必须为正整数';}if(through>=3&&d.train){if(!selectedNode(d))e.node='请选择训练节点';if(!d.gpus.length)e.gpus='至少选择 1 张 GPU';if(!(d.epochs>0&&d.lr>0&&Number.isInteger(d.batch)&&d.batch>0))e.parameters='请填写有效的训练轮数、学习率和每卡批量';}state.errors=e;if(e.name||e.student)state.step=1;else if(e.dataset||e.teacher||e.endpoint||e.apiModel)state.step=2;else if(e.node||e.gpus)state.step=3;return !Object.keys(e).length;}
  function taskPage(){
    const project=activeProject();
    const projectTasks=tasks.filter(t=>t.project===project.id);
    const visible=projectTasks.filter(t=>state.taskFilter==='all'||(state.taskFilter==='running'?['scheduled','preparing','running'].includes(t.status):t.status===state.taskFilter));
    const teacher=teachers.find(t=>t.id===project.teacher)?.name;
    return `${pageHead(esc(project.name),`<div class="ds-row">${button('项目设置','project-settings')}${button(icon('plus')+'新建任务','new','ds-primary')}</div>`,teacher?esc(teacher)+' · 默认教师':'默认教师未设置')}

      <div class="ds-toolbar"><h3>蒸馏任务</h3><div class="ds-filter-group ds-push" aria-label="任务状态">${[['all','全部'],['running','运行中'],['succeeded','已完成'],['failed','失败']].map(([v,n])=>`<button type="button" class="ds-filter cursor-interaction" data-action="filter-tasks" data-value="${v}" aria-pressed="${state.taskFilter===v}">${n}</button>`).join('')}</div></div>
      <div class="ds-panel">${visible.map(t=>`<article class="ds-task-row"><div><button type="button" class="ds-task-name cursor-interaction" data-action="detail" data-id="${t.id}">${esc(t.name)}</button><div class="ds-task-meta"><span>${kinds[t.kind].name}</span><span>·</span><span>${t.train?'数据 + 模型':'仅数据'}</span><span>·</span><span>${t.time}</span></div></div><div>${status(t)}<div class="ds-help">${t.status==='running'?stageNames[t.completed]:t.status==='failed'?'学生训练失败':t.status==='pending'?'等待手动启动':''}</div></div><div class="ds-task-output">${t.count?`<div class="ds-count">${t.count} <span class="ds-help">条数据</span></div><div class="ds-help">${t.weights?'含模型权重':'数据可用'}</div>`:'<span class="ds-help">尚无产物</span>'}</div>${button(icon('chevron-right'),'detail','ds-quiet ds-icon',`data-id="${t.id}" aria-label="查看 ${esc(t.name)}"`)}</article>`).join('')||`<div class="ds-empty-project">${icon('layers')}<strong>${projectTasks.length?'暂无符合条件的任务':'这个项目还没有蒸馏任务'}</strong>${projectTasks.length?'':button(icon('plus')+'创建第一个任务','new','ds-primary')}</div>`}</div>
      <div class="ds-note">${visible.length} 个示例任务 · 当前项目</div>`;
  }
  function currentTask(){return tasks.find(t=>t.id===state.detail)||tasks[0];}
  function detail(){const t=currentTask();const lifecycle=t.status==='pending'?button(icon('play')+'启动任务','start','ds-primary'):['scheduled','preparing','running'].includes(t.status)?button('取消任务','cancel'):'';return `${pageHead(esc(t.name),`<div class="ds-row">${button(icon('arrow-left'),'back-list','ds-quiet ds-icon','aria-label="返回任务列表"')}${button('复用配置','clone')}${lifecycle}</div>`,`${esc(projects.find(p=>p.id===t.project)?.name||'客服管理')} · ${kinds[t.kind].name}`)}${t.status==='failed'?`<div class="ds-alert">${icon('circle-alert')}<span>学生训练失败，已生成的 ${t.count} 条数据仍可使用。</span>${button('查看日志','show-failed-log','ds-link ds-push')}</div>`:''}<div class="ds-detail-tabs" role="tablist" aria-label="任务详情">${[['overview','运行与产物'],['samples','样本与质量'],['logs','日志']].map(([v,n])=>`<button type="button" role="tab" class="cursor-interaction" aria-selected="${state.detailTab===v}" data-action="detail-tab" data-value="${v}">${n}</button>`).join('')}</div>${state.detailTab==='samples'?samplePage(t):state.detailTab==='logs'?logPage(t):overview(t)}`;}
  function overview(t){const steps=stageNames.slice(0,t.train?5:4);return `<section class="ds-panel ds-detail-panel"><div class="ds-row ds-spread"><h3>执行进度</h3>${status(t)}</div><div class="ds-stages" data-count="${steps.length}" aria-label="执行阶段">${steps.map((name,i)=>`<button type="button" class="ds-stage cursor-interaction ${i<t.completed?'ds-complete':''} ${t.status==='running'&&i===t.completed?'ds-active':''} ${t.status==='failed'&&i===t.completed?'ds-failed':''}" data-action="stage-log" data-value="${i}" aria-label="${name}，${i<t.completed?'已完成':t.status==='failed'&&i===t.completed?'失败':'查看日志'}"><span class="ds-stage-bar"></span><span class="ds-stage-label">${i<t.completed?icon('check'):i+1}${name}</span></button>`).join('')}</div></section><div class="ds-output-grid"><section class="ds-panel ds-output"><span class="ds-output-icon">${icon('database')}</span><div class="ds-muted ds-small">蒸馏数据</div><div class="ds-output-name">${t.count?t.count+' 条 · '+kinds[t.kind].output:'尚未导出'}</div><div class="ds-help">${t.count?'已保存到我的数据集':'数据导出后可预览和复用'}</div><div class="ds-output-actions">${button('预览样本','open-samples','ds-link',t.count?'':'disabled')}${button('下载数据','download-task','ds-link',t.count?'':'disabled')}${t.count?button('去训练','train-data','ds-link'):''}</div></section>${t.train?`<section class="ds-panel ds-output"><span class="ds-output-icon">${icon('box')}</span><div class="ds-muted ds-small">学生模型</div><div class="ds-output-name">${t.weights?'LoRA 权重已产出':t.status==='failed'?'训练未完成':'等待学生训练'}</div><div class="ds-help">${esc(modelName(t.draft))}</div><div class="ds-output-actions">${t.weights?button('权重文件','weights','ds-link'):button('训练日志','show-failed-log','ds-link')}<span class="ds-tag">效果尚未测评</span></div>${state.open.has('weights')?'<div class="ds-preview ds-small">adapter_model.safetensors<br>adapter_config.json<div class="ds-help">LoRA 适配器，使用时需要对应基模。权重下载在正式平台提供。</div></div>':''}</section>`:`<section class="ds-panel ds-output"><span class="ds-output-icon">${icon('graduation-cap')}</span><div class="ds-muted ds-small">学生训练</div><div class="ds-output-name">本次仅生成数据</div><div class="ds-help">数据就绪后可交给模型训练</div><div class="ds-output-actions">${button('使用数据训练','train-data','ds-link',t.count?'':'disabled')}</div></section>`}</div>${fold('snapshot','任务配置',`<dl class="ds-definition"><dt>配方</dt><dd>${esc(recipeName(t.draft))}</dd><dt>教师</dt><dd>${esc(teacherName(t.draft))}</dd><dt>数据节点</dt><dd>${esc(t.draft.dataNode||'平台默认数据节点')}</dd>${t.train?`<dt>学生基模</dt><dd>${esc(modelName(t.draft))}</dd><dt>训练资源</dt><dd>${esc(gpuLabel(t.draft))} · ${t.draft.gpus.length} 张</dd><dt>训练方式</dt><dd>${t.draft.method==='lora'?'LoRA':'全量微调'}</dd>`:''}</dl>`)}${fold('storage','存储与版本',`<dl class="ds-definition"><dt>引擎</dt><dd>EasyDistill 2.0.0</dd><dt>数据</dt><dd>用户数据集 / generated / 数据集版本</dd><dt>运行</dt><dd>项目 / runs / 当前任务</dd><dt>基模</dt><dd>共享只读模型池</dd></dl>`)}`;}
  function taskSamples(t){return samples.slice(0,t.count||0);}
  function samplePage(t){if(!t.count)return '<div class="ds-panel ds-empty">尚无已导出的数据</div>';const list=taskSamples(t).filter(s=>(t.kind==='dpo'?s.margin:s.score)>=state.previewThreshold);state.sampleIndex=Math.min(state.sampleIndex,Math.max(0,list.length-1));const s=list[state.sampleIndex];return `<section class="ds-panel ds-detail-panel"><div class="ds-preview-head"><span class="ds-tag">${kinds[t.kind].output}</span><div class="ds-row"><span class="ds-small ds-muted">${list.length?state.sampleIndex+1:0} / ${list.length}</span>${button(icon('chevron-left'),'sample-previous','ds-icon','aria-label="上一条样本" '+(state.sampleIndex===0?'disabled':''))}${button(icon('chevron-right'),'sample-next','ds-icon','aria-label="下一条样本" '+(state.sampleIndex>=list.length-1?'disabled':''))}</div></div>${s?`<div class="ds-row ds-spread"><span class="ds-small ds-muted">${t.kind==='dpo'?'评分差':'有用性'}</span><span class="ds-small">${t.kind==='dpo'?s.margin+' 分':s.score+' / 9'}</span></div><p class="ds-sample-question">${esc(s.q)}</p>${t.kind==='dpo'?`<div class="ds-pair"><div><span class="ds-small ds-green">优选回答</span><p>${esc(s.chosen)}</p></div><div><span class="ds-small ds-red">差选回答</span><p>${esc(s.rejected)}</p></div></div>`:`<p class="ds-sample-answer">${esc(s.a)}</p>`}`:'<div class="ds-empty">当前条件下没有样本</div>'}${fold('sample-filter','筛选预览',`<label class="ds-range">${t.kind==='dpo'?'最小评分差':'最低有用性'}<input type="range" id="ds-preview-threshold" min="0" max="9" value="${state.previewThreshold}" aria-label="样本筛选阈值"><span>${state.previewThreshold}</span></label><div class="ds-help">只筛选当前预览，不修改数据集；分数为示例。</div>`)}</section>`;}
  function logPage(t){const count=t.train?5:4;state.selectedStage=Math.min(state.selectedStage,count-1);const i=state.selectedStage,lines=i<t.completed?`[${stageNames[i]}] 已完成\n${i===3?'已登记独立数据资产，共 '+t.count+' 条。':i===4?'已生成 LoRA 适配器权重。':'阶段中间产物已保留。'}`:t.status==='failed'&&i===4?'[学生训练] 训练镜像启动失败（示例）\n已导出的数据集保留。':t.status==='running'&&i===t.completed?'[蒸馏数据] 正在执行生成与质量筛选（示例）':'该阶段尚无日志。';return `<section class="ds-panel ds-detail-panel"><div class="ds-kind-tabs">${stageNames.slice(0,count).map((n,i)=>`<button type="button" class="ds-pill cursor-interaction" data-action="log-stage" data-value="${i}" aria-pressed="${state.selectedStage===i}">${n}</button>`).join('')}</div><pre class="ds-code">${esc(lines)}</pre></section>`;}
  function allDatasets(){return [...seeds,...tasks.filter(t=>t.count).map(t=>({id:'data-'+t.id,name:t.name+' · 数据',source:'generated',format:t.kind==='dpo'?'DPO':'SFT',count:t.count,task:t,records:taskSamples(t).map(s=>t.kind==='dpo'?{instruction:s.q,chosen:s.chosen,rejected:s.rejected}:{instruction:s.q,output:s.a})}))];}
  function datasetPage(){const rows=allDatasets().filter(d=>state.datasetFilter==='all'||d.source===state.datasetFilter);return `${pageHead('我的数据集',`<div class="ds-row">${button('候选登记','candidate')}${button(icon('upload')+'上传数据','upload','ds-primary')}</div>`)}${state.importPanel?importEditor():''}<div class="ds-toolbar"><div class="ds-filter-group">${[['all','全部'],['upload','上传'],['candidate','候选登记'],['generated','蒸馏生成']].map(([v,n])=>`<button type="button" class="ds-filter cursor-interaction" data-action="filter-datasets" data-value="${v}" aria-pressed="${state.datasetFilter===v}">${n}</button>`).join('')}</div></div><div class="ds-panel">${rows.map(d=>`<article class="ds-data-row"><div><strong>${esc(d.name)}</strong><div class="ds-task-meta"><span>${d.format}</span><span>·</span><span>${{upload:'上传',candidate:'候选登记',generated:'蒸馏生成'}[d.source]}</span></div></div><span class="ds-small">${d.count} 条</span><div class="ds-data-actions">${button('预览','dataset-preview','ds-link',`data-id="${d.id}"`)} ${button(d.source==='generated'?'去训练':'用于蒸馏',d.source==='generated'?'train-data':'use-dataset','ds-link',`data-id="${d.id}"`)}</div></article>`).join('')}</div>${state.open.has('dataset-preview')?datasetPreview():''}<div class="ds-note">数据属于当前用户，可跨项目复用</div>`;}
  function datasetPreview(){const d=allDatasets().find(d=>d.id===state.previewDataset);return d?`<section class="ds-panel ds-detail-panel ds-block"><div class="ds-preview-head"><h3>${esc(d.name)}</h3>${button('收起','close-preview','ds-quiet')}</div><pre class="ds-code">${esc(JSON.stringify(d.records[0],null,2))}</pre><div class="ds-row ds-block"><span class="ds-help">首条记录 · 原始字段保留</span>${button('下载数据','download-dataset','ds-link ds-push',`data-id="${d.id}"`)}</div></section>`:'';}
  function importEditor(){return `<section class="ds-panel ds-import-panel"><div class="ds-row ds-spread"><h3>${state.importPanel==='upload'?'上传数据集':'登记候选数据'}</h3>${button('关闭','close-import','ds-quiet')}</div><div class="ds-block">${state.importPanel==='upload'?'<label class="ds-field"><span class="ds-label">JSON / JSONL 文件</span><input class="ds-input" id="ds-upload-file" type="file" accept=".json,.jsonl"><span class="ds-help">文件仅在当前示例中解析</span></label>':`<label class="ds-field"><span class="ds-label">已发现的候选</span><select class="ds-input" id="ds-candidate"><option value="qa">业务知识问答.jsonl</option><option value="reason">订单推理.jsonl</option></select></label><div class="ds-block">${button('登记到数据集','register-candidate','ds-primary')}</div>`}${state.importError?`<div class="ds-error" role="alert">${esc(state.importError)}</div>`:''}</div></section>`;}
  function projectPage(){
    const seed=seeds.find(s=>s.id===state.pendingDataset);
    return `${pageHead(seed?'选择所属项目':'蒸馏项目',button(icon('plus')+'新建项目','project-new','ds-primary'))}
      ${seed?`<div class="ds-project-select"><span>${icon('file-json')} 已选数据：${esc(seed.name)}</span>${button('取消选择','cancel-project-selection','ds-link')}</div>`:''}
      ${error('project')}
      ${state.projectNew?`<section class="ds-panel ds-import-panel"><div class="ds-grid"><label class="ds-field"><span class="ds-label">项目名称</span><input class="ds-input" id="ds-project-name" maxlength="100"></label><label class="ds-field"><span class="ds-label">默认教师（可选）</span><select class="ds-input" id="ds-project-teacher">${options([['','在任务中配置'],...teachers.map(t=>[t.id,t.name])],'')}</select></label></div><div class="ds-row ds-block">${button('创建并进入','project-save','ds-primary')}${button('取消','project-dismiss')}</div></section>`:''}
      <div class="ds-grid">${projects.map(project=>{
        const list=tasks.filter(t=>t.project===project.id),running=list.filter(t=>['scheduled','preparing','running'].includes(t.status)).length;
        const teacher=teachers.find(t=>t.id===project.teacher)?.name;
        return `<section class="ds-panel ds-project"><div class="ds-project-heading"><span class="ds-output-icon">${icon('folder-open')}</span><h3>${esc(project.name)}</h3></div><div class="ds-caption">${esc(project.description||'业务项目')}</div><div class="ds-row ds-block"><span class="ds-tag">${icon('radio-tower')}${teacher?esc(teacher):'默认教师未设置'}</span></div><div class="ds-project-footer"><span class="ds-muted">${list.length} 个任务${running?' · '+running+' 个运行中':''}</span>${button((seed?'选择此项目':'进入项目')+' '+icon('arrow-right'),'open-project','ds-link',`data-id="${project.id}"`)}</div></section>`;
      }).join('')}</div>`;
  }
  function activeProject(){return projects.find(project=>project.id===state.projectId);}
  function breadcrumb(){
    const project=activeProject();if(!project)return '';
    const leaf=state.screen==='create'?'新建任务':state.screen==='detail'?currentTask().name:'';
    return `<nav class="ds-breadcrumb" aria-label="页面层级"><button type="button" class="cursor-interaction" data-nav="projects">项目</button>${icon('chevron-right')}${leaf?`<button type="button" class="cursor-interaction" data-action="back-list">${esc(project.name)}</button>${icon('chevron-right')}<span aria-current="page">${esc(leaf)}</span>`:`<span aria-current="page">${esc(project.name)}</span>`}</nav>`;
  }
  function projectSettings(project){
    return `<section class="ds-panel ds-import-panel"><div class="ds-grid"><label class="ds-field"><span class="ds-label">项目名称</span><input class="ds-input" id="ds-edit-project-name" value="${esc(project.name)}" maxlength="100"></label><label class="ds-field"><span class="ds-label">默认教师（可选）</span><select class="ds-input" id="ds-edit-project-teacher">${options([['','在任务中配置'],...teachers.map(t=>[t.id,t.name])],project.teacher)}</select></label></div><div class="ds-row ds-block">${button('保存设置','project-update','ds-primary')}${button('取消','project-settings')}</div><div class="ds-help">默认教师用于新任务；已有任务保留原配置。</div></section>`;
  }
  function beginTask(datasetId=''){
    const project=activeProject();
    if(!project){state.screen='list';state.nav='projects';toast('请先选择项目');return;}
    state.draft=freshDraft(project.id);
    const seed=seeds.find(s=>s.id===datasetId);
    if(seed){
      state.draft.dataset=seed.id;
      state.draft.kind=kinds[seed.kind]?seed.kind:'sft';
      state.draft.recipe=kinds[state.draft.kind].recipes[0][0];
      if(state.draft.kind==='mm')state.draft.teacher='demo-vl';
    }
    state.screen='create';state.nav='projects';state.step=1;state.errors={};state.open.clear();state.seedPreview=false;state.teacherTest=false;
  }
  function openProject(projectId){
    if(!projects.some(project=>project.id===projectId))return;
    state.projectId=projectId;state.nav='projects';state.screen='project';state.taskFilter='all';state.projectSettings=false;state.errors={};state.open.clear();
    if(state.pendingDataset){const seed=state.pendingDataset;state.pendingDataset='';beginTask(seed);}
  }
  function download(name,records){toast('下载入口示例：'+name+'.jsonl · '+records.length+' 条。正式平台从数据集下载接口取得文件。');}
  function navigate(nav){
    state.nav=nav==='datasets'?'datasets':'projects';state.screen='list';state.projectId=null;state.pendingDataset='';state.projectSettings=false;state.errors={};state.open.clear();
    render();remember();
  }
  root.addEventListener('click',event=>{
    const nav=event.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
    const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,v=el.dataset.value,id=el.dataset.id,d=state.draft;
    if(a==='new'){beginTask();}
    else if(a==='back-list'){state.nav='projects';state.screen='project';state.errors={};state.open.clear();}
    else if(a==='mode'){d.train=v==='true';state.errors={};}
    else if(a==='kind'){d.kind=v;d.recipe=kinds[v].recipes[0][0];d.dataset=v==='mm'?'demo-images':v==='agent'?'demo-agent':v==='cot'?'demo-cot':'demo-seed';if(v==='mm'){d.teacher='demo-vl';if(d.student&&!models.find(m=>m.id===d.student)?.vision)d.student='';}state.seedPreview=false;state.errors={};}
    else if(a==='step'){const target=Number(v);if(target<state.step||validate(target-1))state.step=target;}
    else if(a==='next'){if(validate(state.step))state.step=Math.min(3,state.step+1);}
    else if(a==='previous')state.step=Math.max(1,state.step-1);
    else if(a==='seed-preview')state.seedPreview=!state.seedPreview;
    else if(a==='test-teacher'){state.teacherTest=true;}
    else if(a==='submit'){if(validate(3)){const snapshot=structuredClone(d);snapshot.secretRef='';const t={id:'local-'+Date.now(),name:d.name,kind:d.kind,status:'pending',count:0,completed:0,project:d.project,time:'刚刚',train:d.train,draft:snapshot};tasks.unshift(t);state.detail=t.id;state.detailTab='overview';state.screen='detail';state.nav='projects';state.open.clear();toast('示例任务已创建，尚未启动');}}
    else if(a==='filter-tasks')state.taskFilter=v;
    else if(a==='detail'){const task=tasks.find(t=>t.id===id&&t.project===state.projectId);if(!task)return;state.detail=task.id;state.screen='detail';state.detailTab='overview';state.open.clear();}
    else if(a==='detail-tab'){state.detailTab=v;state.sampleIndex=0;state.previewThreshold=0;}
    else if(a==='open-samples'){state.detailTab='samples';state.sampleIndex=0;state.previewThreshold=0;}
    else if(a==='start'){const t=currentTask();t.status='running';toast('仅演示运行状态，未提交服务器');}
    else if(a==='cancel'){currentTask().status='canceled';toast('示例任务已取消');}
    else if(a==='clone'){state.draft=structuredClone(currentTask().draft);state.draft.name=currentTask().name+' · 副本';state.projectId=currentTask().project;state.nav='projects';state.step=1;state.screen='create';state.errors={};state.open.clear();}
    else if(a==='stage-log'||a==='log-stage'){state.selectedStage=Number(v);state.detailTab='logs';}
    else if(a==='show-failed-log'){state.selectedStage=4;state.detailTab='logs';}
    else if(a==='sample-previous')state.sampleIndex=Math.max(0,state.sampleIndex-1);
    else if(a==='sample-next')state.sampleIndex++;
    else if(a==='weights'){state.open.has('weights')?state.open.delete('weights'):state.open.add('weights');}
    else if(a==='train-data'){toast('正式平台将打开模型训练，并带入此数据集');}
    else if(a==='download-task'){const t=currentTask();download(t.name,allDatasets().find(d=>d.id==='data-'+t.id).records);}
    else if(a==='download-dataset'){const ds=allDatasets().find(d=>d.id===id);download(ds.name,ds.records);}
    else if(a==='filter-datasets'){state.datasetFilter=v;}
    else if(a==='dataset-preview'){state.previewDataset=id;state.open.add('dataset-preview');}
    else if(a==='close-preview'){state.open.delete('dataset-preview');}
    else if(a==='use-dataset'){state.pendingDataset=id;state.projectId=null;state.screen='list';state.nav='projects';state.errors={};state.open.clear();}
    else if(a==='upload'||a==='candidate'){state.importPanel=a;state.importError='';}
    else if(a==='close-import')state.importPanel='';
    else if(a==='register-candidate'){const choice=root.querySelector('#ds-candidate').value;seeds.push({id:'candidate-'+Date.now(),name:choice==='qa'?'业务知识问答':'订单推理',source:'candidate',format:'JSONL',count:2,kind:'sft',records:samples.slice(0,2).map(s=>({instruction:s.q}))});state.importPanel='';state.datasetFilter='all';toast('候选数据已登记到当前示例');}
    else if(a==='project-new')state.projectNew=true;
    else if(a==='project-dismiss')state.projectNew=false;
    else if(a==='project-save'){const name=root.querySelector('#ds-project-name').value.trim();if(!name){toast('请填写项目名称');return;}const project={id:'project-'+Date.now(),name,teacher:root.querySelector('#ds-project-teacher').value};projects.push(project);state.projectNew=false;openProject(project.id);}
    else if(a==='open-project'){openProject(id);}
    else if(a==='project-settings'){state.projectSettings=!state.projectSettings;}
    else if(a==='project-update'){const project=activeProject(),name=root.querySelector('#ds-edit-project-name').value.trim();if(!name){toast('请填写项目名称');return;}project.name=name;project.teacher=root.querySelector('#ds-edit-project-teacher').value;state.projectSettings=false;toast('项目设置已保存到当前示例');}
    else if(a==='cancel-project-selection'){state.pendingDataset='';}
    render();remember();
  });
  root.addEventListener('input',event=>{const el=event.target;if(el.dataset.field){const key=el.dataset.field;state.draft[key]=el.type==='number'||el.type==='range'?Number(el.value):el.value;if(key==='threshold'){const out=root.querySelector('#ds-threshold-value');if(out)out.textContent=el.value+' / 9';}}else if(el.dataset.map){state.draft.fieldMapping={...state.draft.fieldMapping,[el.dataset.map]:el.value};}});
  root.addEventListener('change',async event=>{
    const el=event.target,d=state.draft;
    if(el.dataset.gpu!==undefined){const i=Number(el.dataset.gpu);if(selectedNode()?.busy.includes(i))return;d.gpus=el.checked?[...new Set([...d.gpus,i])].sort((a,b)=>a-b):d.gpus.filter(g=>g!==i);delete state.errors.gpus;render();remember();}
    else if(el.dataset.field){const key=el.dataset.field;d[key]=el.type==='number'||el.type==='range'?Number(el.value):el.value;delete state.errors[key];if(key==='node')d.gpus=[];if(key==='student')d.template=models.find(m=>m.id===d.student)?.template||'qwen';if(key==='teacherSource')state.teacherTest=false;if(el.tagName==='SELECT'||el.type==='radio'){render();}remember();}
    else if(el.id==='ds-preview-threshold'){state.previewThreshold=Number(el.value);state.sampleIndex=0;render();}
    else if(el.id==='ds-upload-file'){
      const file=el.files[0];if(!file)return;if(file.size>10*1024*1024){state.importError='示例支持 10 MB 以内文件';render();return;}
      try{const text=(await file.text()).replace(/^\uFEFF/,'');const records=file.name.toLowerCase().endsWith('.jsonl')?text.split(/\r?\n/).filter(line=>line.trim()).map((line,i)=>{try{return JSON.parse(line);}catch{throw Error('第 '+(i+1)+' 条 JSONL 记录无效');}}):JSON.parse(text);if(!Array.isArray(records)||!records.length||records.some(r=>!r||Array.isArray(r)||typeof r!=='object'))throw Error('需要非空 JSON 对象数组，或每行一个对象的 JSONL');seeds.unshift({id:'upload-'+Date.now(),name:file.name,source:'upload',format:'JSONL',count:records.length,kind:'sft',records});state.importPanel='';state.datasetFilter='all';toast('文件已加入当前示例');}catch(e){state.importError=e.message;}render();
    }
  });
  root.addEventListener('toggle',event=>{const id=event.target.dataset?.fold;if(id){event.target.open?state.open.add(id):state.open.delete(id);}},true);
  window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState,m=snapshot?.modelContent;if(m?.design==='distill-project-first'&&(m.view!==state.nav||m.screen!==state.screen||m.projectId!==state.projectId||JSON.stringify(snapshot.privateContent?.draft)!==JSON.stringify({...state.draft,secretRef:''}))){restore(snapshot);render();}});
  render();
  if(globalThis.Tweak){const design={density:'comfortable'};new Tweak({container:root,onChange:()=>root.dataset.density=design.density}).addSelect(design,'density',{label:'列表密度',options:[{label:'舒适',value:'comfortable'},{label:'紧凑',value:'compact'}]});}
})();
</script>
