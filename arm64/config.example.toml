[server]
host = "172.18.127.43"
port = 8080
mode = "release"

[database]
enabled = true
driver = "mysql"
host = "172.18.127.43"
port = 3306
name = "gcs_distill_arm_v2_prod"
user = "gcs_distill_arm_prod"
